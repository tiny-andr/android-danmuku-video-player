[package]
name = "bplayer-android"
version = "0.1.0"
description = "Bplayer Android 移植验证工程"
edition = "2021"

[lib]
name = "bplayer_android_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["protocol-asset"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# PGS（蓝光位图字幕）：libpgs 是纯 Rust 的 MKV/M2TS/SUP 抽取 + RLE 解码，按 Cues
# 索引只读字幕块（不扫全片）；png 也是纯 Rust。两者都不需要 NDK 之外的 C 库，
# 交叉编译到 aarch64-linux-android 与桌面版同一套依赖。
libpgs = "0.6"
png = "0.17"

[profile.release]
opt-level = 3
lto = true
strip = true
