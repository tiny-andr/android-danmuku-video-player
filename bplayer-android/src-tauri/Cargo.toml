[package]
name = "bplayer-android"
version = "0.1.4"
description = "Bplayer Android 移植验证工程"
edition = "2021"

[lib]
name = "bplayer_android_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["protocol-asset"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# PGS（蓝光位图字幕）：libpgs 是纯 Rust 的 MKV/M2TS/SUP 抽取 + RLE 解码，按 Cues
# 索引只读字幕块（不扫全片）；png 也是纯 Rust。两者都不需要 NDK 之外的 C 库，
# 交叉编译到 aarch64-linux-android 与桌面版同一套依赖。
libpgs = "0.6"
png = "0.17"
# 网络源的内嵌字幕抽取要和本地一样「按 Cues 稀疏读」：Android 上没有可挂载的
# SMB 路径，只能经本机媒体代理按 HTTP Range 随机读。ureq 关掉 TLS（走 127.0.0.1
# 明文），依赖小、能交叉编译到 aarch64-linux-android。
ureq = { version = "2", default-features = false }

[profile.release]
opt-level = 3
lto = true
strip = true

# debug 包也要有优化：现在发的 APK 走的是 `tauri android build --debug`，Rust 侧默认
# opt-level 0。实测同一份 884 事件 / 35.6 GB 的 PGS 轨，debug 构建解析 45–50 s，
# release 只要 4.3 s（比桌面还快）——差距全在优化级别，不是磁盘（/sdcard 顺序读实测
# 1.3–1.6 GB/s）。MKV 稀疏抽取、PGS 合成、目录扫描、缩略图解码都跑在这条路径上，
# 所以 debug 包必须带优化，否则每次调这些功能都在白等几十秒。
[profile.dev]
opt-level = 2
# 这个 .so 会原样进 debug APK：带完整 DWARF 时 187 MB，其中真正机器码只有 4 MB，
# 其余全是调试段。发布用的 debug 包只需要能解析栈帧，不需要逐行源码映射，
# 所以保留符号表、丢掉 DWARF（10 MB 量级）。要逐行 native 调试时临时注释这一行。
strip = "debuginfo"

# 依赖也一起优化：只给本 crate 设 opt-level 的话，libpgs / png 的解码循环仍是 0 级，
# 而 PGS 慢的正是 libpgs 那段。首次编译会慢几分钟，之后是增量。
[profile.dev.package."*"]
opt-level = 2

